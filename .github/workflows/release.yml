name: Validate and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Original fully validated tag-push run ID to publish without rebuilding
        required: true
        type: string
      release_tag:
        description: Existing version tag belonging to that run
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  source:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned build tools
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          python -m pip install build==1.3.0
      - name: Rust unit tests
        env:
          RUSTUP_TOOLCHAIN: '1.85.0'
          PYO3_PYTHON: python
          RUSTFLAGS: '-C target-cpu=generic'
        run: cargo test --locked
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYCODE'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}'
          assert tomllib.loads(Path('Cargo.toml').read_text())['package']['version'] == version
          PYCODE
      - name: Build source distribution
        run: |
          python -m build --sdist
          python scripts/verify_artifacts.py dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, platform: linux, arch: x86_64}
          - {runner: ubuntu-24.04-arm, platform: linux, arch: aarch64}
          - {runner: macos-15-intel, platform: macos, arch: x86_64}
          - {runner: macos-15, platform: macos, arch: arm64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdist
          path: source-dist
      - name: Install pinned wheel builder
        run: python -m pip install cibuildwheel==4.2.0
      - name: Install macOS Rust toolchain
        if: matrix.platform == 'macos'
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Build and test wheel from source distribution
        env:
          CIBW_PLATFORM: ${{ matrix.platform }}
          CIBW_ARCHS: ${{ matrix.arch }}
        run: |
          python -m cibuildwheel source-dist/*.tar.gz --output-dir wheelhouse
          python scripts/verify_artifacts.py wheelhouse
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel-${{ matrix.platform }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  installed:
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
        target:
          - {runner: ubuntu-24.04, platform: linux, arch: x86_64}
          - {runner: ubuntu-24.04-arm, platform: linux, arch: aarch64}
          - {runner: macos-15-intel, platform: macos, arch: x86_64}
          - {runner: macos-15, platform: macos, arch: arm64}
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wheel-${{ matrix.target.platform }}-${{ matrix.target.arch }}
          path: wheelhouse
      - name: Install binary without a source build
        run: |
          python -m pip install pytest==8.4.2
          python -m pip install --only-binary=:all: --no-deps wheelhouse/*.whl
      - name: Verify installed package outside source checkout
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PYCODE'
          import importlib.util, pathlib, sys, jam_bls
          print(sys.version)
          print(jam_bls.__file__)
          assert 'site-packages' in pathlib.Path(jam_bls.__file__).parts
          assert importlib.util.find_spec('pyjamaz') is None
          PYCODE
          python -m pytest -q "$GITHUB_WORKSPACE/tests"

  publish:
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    needs: [source, wheels, installed]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/py-jam-bls-bindings/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdist
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 (peeled commit)
        with:
          packages-dir: dist/

  recover_publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/py-jam-bls-bindings/
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate original tag run and immutable artifact identities
        id: original
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python scripts/validate_release_run.py "$RELEASE_RUN_ID" "$RELEASE_TAG"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.original.outputs.artifact_ids }}
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: dist
      - name: Verify complete release artifacts before publication
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python scripts/verify_artifacts.py dist --complete --version "${RELEASE_TAG#v}"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 (peeled commit)
        with:
          packages-dir: dist/
          verbose: false
